news:
  - date: "2026.07"
    text: "Our work on <strong>semantics-guided hierarchical decision-making for autonomous driving</strong> was published in <em>Transportation Research Part C: Emerging Technologies</em>."
  - date: "2026.05"
    text: "Joined <strong>Prof. Jiawei Wang's research group</strong> at The Hong Kong University of Science and Technology (Guangzhou) as a Research Assistant."
  - date: "2026.01"
    text: "One paper accepted by <strong>IEEE Intelligent Transportation Systems Magazine</strong> on multisensory information processing and route change decisions."
  - date: "2025.11"
    text: "Our work on <strong>Multi-scale Wavelet-Mamba traffic forecasting</strong> was published in <em>Scientific Reports</em>."
  - date: "2025.03"
    text: "Our paper on <strong>navigation information and driver route choice</strong> was published in <em>Research in Transportation Economics</em>."
  - date: "2025.01"
    text: "Presented work on multisensory information processing and lane change decisions at the <strong>TRB 104th Annual Meeting</strong>."

